<!doctype html>
<!-- Must carry `blanc-shell` for the same reason blanc.html does: it is the
     scope blanc.css's page baseline is written against. -->
<html lang="en" class="blanc-shell">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blanc harness</title>
    <script>
      // Preload-bridge stub. Must be a classic script so it runs BEFORE any ES
      // module import — several renderer modules (e.g. playerBus.ts) touch
      // window.api at module-eval time.
      (function () {
        var explicit = {
          blancSetFullScreen: function () { return Promise.resolve({ ok: true }); },
          blancOpen: function () { return Promise.resolve({ ok: true }); },
          blancClose: function () { return Promise.resolve({ ok: true }); },
          syncLibrary: function () { return Promise.resolve([]); },
          // Reading Finder and the Read tab both read the library; without this
          // the catch-all proxy hands back undefined and they render empty.
          listLibrary: function () { return Promise.resolve([]); },
          getLibraryFolders: function () { return Promise.resolve([]); },
          getWatchFolder: function () { return Promise.resolve(null); },
          importFiles: function () { return Promise.resolve([]); },
          importFolder: function () { return Promise.resolve([]); },
          setWatchFolder: function () { return Promise.resolve({ folder: null, items: [] }); },
          setLibraryFolders: function (f) { return Promise.resolve({ folders: f, items: [] }); },
          setItemFolder: function () { return Promise.resolve([]); },
          ankiStatus: function () { return Promise.resolve({ connected: false, decks: [] }); },
          ankiMineNote: function () { return Promise.resolve({ ok: false, error: 'harness' }); },
          systemGetMetrics: function () {
            return Promise.resolve({
              cpuLoad: 0.23,
              freemem: 9 * Math.pow(1024, 3),
              totalmem: 16 * Math.pow(1024, 3),
              platform: 'win32',
              uptime: 54321,
              battery: 0.8,
              onBattery: false,
            });
          },
          toolboxPickSearchFolder: function () { return Promise.resolve(null); },
          toolboxFileSearch: function () { return Promise.resolve({ ok: true, results: [], scanned: 0, truncated: false }); },
          launchTarget: function () { return Promise.resolve('Harness: launching files is disabled.'); },
          pickShortcut: function () {
            // Stands in for the native file dialog so Workspace Launcher's
            // picker path is clickable here; the real one returns null on cancel.
            return Promise.resolve({ target: 'C:\\Windows\\System32\\notepad.exe', name: 'notepad', icon: '' });
          },
          launchAutomationBuilder: function () { return Promise.resolve({ ok: false, error: 'Harness: no PowerShell here.' }); },

          // --- Stubs added 2026-07-21 so the Deck and Cards tabs stop crashing ---
          //
          // The catch-all proxy below answers unknown calls with
          // Promise.resolve(undefined), which is fine for fire-and-forget IPC but
          // fatal wherever the caller destructures or reads a property off the
          // result. Three modules did exactly that and took the whole shell down
          // through the error boundary, which made the Deck and Cards tabs
          // unverifiable in the harness:
          //
          //   profileState  `(await profileGet()).legacyMigrated`
          //   assetStore    `assetsList().then(({ assets, statuses }) => …)`
          //   playerBus     `await playerWindowId()` at module-eval time
          //
          // These return the shape each caller expects, with empty data — enough
          // to render, never enough to look like real content.
          profileGet: function () {
            return Promise.resolve({
              activeId: 'japanese',
              profiles: [],
              // True so init does not then call profileMigrateLegacy and read
              // fields off *its* undefined result.
              legacyMigrated: true,
            });
          },
          profileMigrateLegacy: function () {
            return Promise.resolve({ activeId: 'japanese', profiles: [], legacyMigrated: true });
          },
          profileSwitch: function () { return Promise.resolve({ ok: false, error: 'Harness: profiles are read-only.' }); },
          profileUpdate: function () { return Promise.resolve({ ok: false, error: 'Harness: profiles are read-only.' }); },
          profileCreate: function () { return Promise.resolve({ ok: false, error: 'Harness: profiles are read-only.' }); },
          profileDelete: function () { return Promise.resolve({ ok: false, error: 'Harness: profiles are read-only.' }); },
          assetsList: function () { return Promise.resolve({ assets: [], statuses: [] }); },
          playerWindowId: function () { return Promise.resolve(0); },
          // Read-only pitch data: available:false exercises the panel's
          // "Kanjium not installed" branch, which is the honest harness answer.
          dictPitch: function () { return Promise.resolve({ available: false, entries: [] }); },
        };

        // --- Collected tools / App Drawer stub (Pillar 3, added 2026-07-22) ---
        //
        // The catch-all proxy's Promise.resolve(undefined) is fatal here too —
        // every tools* caller reads .ok/.tools/.folders off the result. Unlike
        // the read-only stubs above, this one needs to actually behave like the
        // store (add/remove/list) for the App Drawer's create-folder/add-item/
        // move/launch flow to be exercisable in the harness at all, so it is a
        // tiny in-memory version of src/main/collectedTools.ts rather than a
        // fixed response.
        (function () {
          var toolsStore = { tools: [], folders: [] };
          var nextId = 1;
          function genId(prefix) { return prefix + '-' + nextId++; }
          explicit.toolsList = function () {
            return Promise.resolve({ version: 1, tools: toolsStore.tools.slice(), folders: toolsStore.folders.slice() });
          };
          explicit.toolsAdd = function (input) {
            var tool = {
              id: genId('tool'),
              url: input.url,
              name: input.name || input.url,
              note: input.note,
              tags: input.tags,
              favicon: input.favicon,
              addedAt: Date.now(),
              source: input.source === 'extension' ? 'extension' : 'app',
              kind: input.kind || 'link',
              folderId: input.folderId || null,
            };
            toolsStore.tools.unshift(tool);
            return Promise.resolve({ ok: true, tool: tool, duplicate: false });
          };
          explicit.toolsRemove = function (id) {
            toolsStore.tools = toolsStore.tools.filter(function (t) { return t.id !== id; });
            return Promise.resolve({ ok: true, store: toolsStore });
          };
          explicit.toolsUpdate = function (id, patch) {
            var tool = toolsStore.tools.filter(function (t) { return t.id === id; })[0];
            if (!tool) return Promise.resolve({ ok: false, error: 'Not found' });
            if (patch && typeof patch.name === 'string') tool.name = patch.name;
            if (patch && typeof patch.note === 'string') tool.note = patch.note;
            if (patch && patch.folderId !== undefined) tool.folderId = patch.folderId;
            return Promise.resolve({ ok: true, tool: tool });
          };
          explicit.toolsMoveItem = function (id, folderId) {
            return explicit.toolsUpdate(id, { folderId: folderId });
          };
          explicit.toolsAddFolder = function (name, parentFolderId) {
            var folder = { id: genId('folder'), name: name, parentFolderId: parentFolderId || null, order: toolsStore.folders.length };
            toolsStore.folders.push(folder);
            return Promise.resolve({ ok: true, folder: folder });
          };
          explicit.toolsRenameFolder = function (id, name) {
            var folder = toolsStore.folders.filter(function (f) { return f.id === id; })[0];
            if (!folder) return Promise.resolve({ ok: false, error: 'Not found' });
            folder.name = name;
            return Promise.resolve({ ok: true, folder: folder });
          };
          explicit.toolsRemoveFolder = function (id) {
            toolsStore.folders = toolsStore.folders.filter(function (f) { return f.id !== id; });
            toolsStore.tools.forEach(function (t) { if (t.folderId === id) t.folderId = null; });
            return Promise.resolve({ ok: true, store: toolsStore });
          };
        })();

        window.api = new Proxy(explicit, {
          get: function (target, prop) {
            if (prop in target) return target[prop];
            if (typeof prop === 'string' && prop.indexOf('on') === 0) {
              return function () { return function () {}; };
            }
            return function () { return Promise.resolve(undefined); };
          },
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Loads the REAL Blanc entry (src/renderer/blancMain.tsx), the same module
      the packaged Blanc window boots via blanc.html. It used to load a
      harness-only module that mounted BlancShell directly, which meant the
      harness never exercised the actual boot path.
    -->
    <script type="module" src="/src/renderer/blancMain.tsx"></script>
  </body>
</html>
