<!doctype html>
<!-- `blanc-shell` scopes blanc.css's page baseline to this document. Study OS
     imports the same sheet, so an unscoped body rule there paints the Study OS
     page with Blanc's dark fallbacks. Stamped here, not by JS, so the Blanc
     window has no unpainted first frame. -->
<html lang="en" class="blanc-shell">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blanc Toolbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/blancMain.tsx"></script>
  </body>
</html>
