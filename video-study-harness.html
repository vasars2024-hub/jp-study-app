<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video study harness</title>
    <style>
      /* 16px, because that is the root the workspace runs at in the app and every
         panel width in mediaWorkspace.css is in rem. At the 14px this page used
         to declare, a 24rem rail measured 336px instead of 384 — every geometry
         reading was 12.5% roomier than the product. */
      html {
        font-size: 16px;
      }
      body {
        margin: 0;
        background: #0a0910;
        color: #e6e6ee;
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      .harness-root {
        padding: 20px;
        display: grid;
        gap: 26px;
        /* Wide enough for the composed cases (V13–V17), which set real window
           widths up to 1440 on the stage. Justify-start keeps the narrower
           stages left-aligned instead of stretched to the widest one. */
        justify-items: start;
        max-width: 1480px;
      }
      .harness-root h1 {
        margin: 0;
        font-size: 20px;
      }
      .harness-shot h2 {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 600;
        color: #b9b9cc;
      }
      .harness-note {
        margin: 0 0 8px;
        font-size: 12px;
        color: #8a8aa0;
      }
      /* The stage is the "window": panels inside are absolutely positioned
         against it, exactly as they are against the player slice. */
      .harness-stage {
        position: relative;
        /* Explicit, because `justify-items: start` on the page grid stops the
           stage stretching — and its children are all absolutely positioned, so
           an auto-width stage collapses to nothing and measures nothing. The
           composed cases override this with their own window width. */
        width: 1180px;
        overflow: hidden;
        border: 1px solid #2a2a3a;
        border-radius: 10px;
        contain: layout paint;
      }
      .harness-workspace {
        position: absolute;
        inset: 0;
      }
      .harness-workspace > .study-player-slice {
        position: absolute !important;
        inset: 0;
      }
      /* Marks which window width a composed case is standing in for. */
      .harness-width-tag {
        position: absolute;
        left: 50%;
        bottom: 2px;
        z-index: 200;
        padding: 1px 6px;
        border-radius: 4px;
        transform: translateX(-50%);
        background: rgb(0 0 0 / 0.6);
        color: #9fb6c9;
        font-size: 11px;
        pointer-events: none;
      }
      .harness-narrow {
        position: absolute;
        inset: 0;
        width: 620px;
        container-type: inline-size;
      }
      /* Stands in for the video frame — a bright gradient, so subtitle contrast
         is judged against picture rather than against flat black. */
      .harness-picture {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 30% 25%, #9fd8ff 0%, #5aa9dd 28%, #2f6f9e 55%, #123a5c 100%),
          linear-gradient(180deg, #cfe9ff 0%, #2b5f86 100%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/__devharness__/videoStudyHarness.tsx"></script>
  </body>
</html>
