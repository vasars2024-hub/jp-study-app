<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gum</title>
    <style>
      :root {
        --bg: #14161c;
        --panel: #1b1e26;
        --panel-2: #21252f;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e8eaef;
        --muted: #98a0af;
        --accent: #9c2b3d;
        --accent-soft: rgba(156, 43, 61, 0.16);
        --ok: #4cc584;
        --warn: #d8a01d;
        --err: #e05555;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px 10px;
      }
      header strong { font-size: 14px; letter-spacing: 0.01em; }
      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: inherit;
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
      }
      .status-chip::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .status-chip.ok { color: var(--ok); }
      .status-chip.ok::before { background: var(--ok); }
      .status-chip.warn { color: var(--warn); }
      .status-chip.warn::before { background: var(--warn); }
      .status-chip.err { color: var(--err); }
      .status-chip.err::before { background: var(--err); }
      #status-detail {
        margin: 0 14px 10px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 12px;
        display: grid;
        gap: 5px;
      }
      #status-detail[hidden] { display: none; }
      #status-detail .row { display: flex; justify-content: space-between; gap: 8px; }
      #status-detail .k { color: var(--muted); }
      #status-detail .v.ok { color: var(--ok); }
      #status-detail .v.err { color: var(--err); }
      #status-detail .v.warn { color: var(--warn); }
      #status-detail a, .linklike {
        color: #d98a97;
        cursor: pointer;
        text-decoration: none;
        background: none;
        border: 0;
        font: inherit;
        padding: 0;
      }
      section { padding: 0 14px; }
      .page-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .page-card .title {
        font-weight: 600;
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .page-card .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .page-card .meta .pill {
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid var(--border);
      }
      .page-card.empty { color: var(--muted); font-size: 12px; }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .actions button {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 10px;
        cursor: pointer;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        text-align: left;
        transition: background 0.12s ease;
      }
      .actions button:hover { background: var(--panel-2); }
      .rec-row { display: flex; gap: 6px; margin: 8px 0 4px; }
      .rec-row button { flex: 1; }
      #rec-stop { background: #c62828; color: #fff; }
      .rec-item { display: flex; gap: 6px; align-items: center; font-size: 12px; margin: 4px 0; }
      .rec-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mode-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .mode-label {
        flex: 1;
        font-size: 12px;
        color: var(--muted);
      }
      .mode-seg {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
      }
      .mode-seg button {
        border: 0;
        border-radius: 999px;
        padding: 4px 10px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
      }
      .mode-seg button:hover { color: var(--text); }
      .mode-seg button.active {
        background: var(--accent, #9c2b3d);
        color: #fff;
      }
      .actions button.primary {
        background: var(--accent-soft);
        border-color: rgba(156, 43, 61, 0.45);
        font-weight: 600;
      }
      .actions button.primary:hover { background: rgba(156, 43, 61, 0.26); }
      .actions button:disabled { opacity: 0.5; cursor: default; }
      h2 {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 6px;
        font-weight: 600;
      }
      #recent { margin-bottom: 10px; }
      .recent-item {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        padding: 5px 2px;
        font-size: 12px;
        border-bottom: 1px solid var(--border);
      }
      .recent-item:last-child { border-bottom: 0; }
      .recent-item .term {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 190px;
      }
      .recent-item .what { color: var(--muted); font-size: 11px; flex-shrink: 0; }
      .recent-item .what.queued { color: var(--warn); }
      #pending-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 14px 8px;
        padding: 7px 12px;
        border-radius: 9px;
        background: rgba(216, 160, 29, 0.1);
        border: 1px solid rgba(216, 160, 29, 0.3);
        font-size: 12px;
        color: var(--warn);
      }
      #pending-bar[hidden] { display: none; }
      #pending-bar button {
        background: none;
        border: 0;
        color: var(--warn);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
      }
      footer {
        display: flex;
        border-top: 1px solid var(--border);
        margin-top: 2px;
      }
      footer button {
        flex: 1;
        background: none;
        border: 0;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        padding: 10px 4px;
        cursor: pointer;
      }
      footer button:hover { color: var(--text); background: var(--panel); }
      #feedback {
        min-height: 1.1em;
        margin: 0 14px 8px;
        font-size: 12px;
        color: var(--muted);
      }
      #feedback.ok { color: var(--ok); }
      #feedback.err { color: var(--err); }
      #feedback.pending { color: var(--warn); }
    </style>
  </head>
  <body>
    <header>
      <strong>Gum</strong>
      <button type="button" id="status-chip" class="status-chip" aria-expanded="false">…</button>
    </header>

    <div id="status-detail" hidden>
      <div class="row"><span class="k" data-i18n="popup_statusApp">Gum app</span><span class="v" id="st-app">…</span></div>
      <div class="row"><span class="k" data-i18n="popup_statusPairing">Pairing</span><span class="v" id="st-pair">…</span></div>
      <div class="row"><span class="k" data-i18n="popup_statusAnki">Anki profile</span><span class="v" id="st-anki">…</span></div>
      <div class="row"><span class="k" data-i18n="popup_statusPending">Waiting to sync</span><span class="v" id="st-pending">0</span></div>
      <div class="row"><button type="button" class="linklike" id="fix-connection" data-i18n="popup_openConnection">Open connection settings</button></div>
    </div>

    <section>
      <div class="page-card" id="page-card">
        <div class="title" id="page-title">…</div>
        <div class="meta" id="page-meta"></div>
      </div>

      <div class="actions" id="actions"></div>

      <!-- Mode is the one setting worth switching mid-session, so it lives here
           rather than only on the options page. -->
      <div class="mode-row">
        <span class="mode-label" data-i18n="popup_modeHighlight">Highlight</span>
        <div class="mode-seg" id="mode-highlight" role="radiogroup" aria-label="What a highlight opens" data-i18n-aria-label="popup_modeHighlightAria">
          <button type="button" role="radio" data-mode="dictionary" data-i18n="popup_modeDictionary">Dictionary AI</button>
          <button type="button" role="radio" data-mode="ai" data-i18n="popup_modeAi">AI OCR</button>
        </div>
      </div>
      <div class="mode-row">
        <span class="mode-label" data-i18n="popup_modeOcr">Screenshot OCR</span>
        <div class="mode-seg" id="mode-ocr" role="radiogroup" aria-label="What an OCR opens" data-i18n-aria-label="popup_modeOcrAria">
          <button type="button" role="radio" data-mode="dictionary" data-i18n="popup_modeDictionary">Dictionary AI</button>
          <button type="button" role="radio" data-mode="ai" data-i18n="popup_modeAi">AI OCR</button>
        </div>
      </div>

      <!-- Tab recorder. Started from here (a toolbar click is the gesture
           chrome.tabCapture needs); recordings upload to Gum in chunks. -->
      <div class="rec-row" id="rec-row">
        <button type="button" id="rec-tab" data-i18n="popup_recTab">Record tab</button>
        <button type="button" id="rec-area" data-i18n="popup_recArea">Record area</button>
        <button type="button" id="rec-audio" data-i18n="popup_recAudio">Record tab audio</button>
        <button type="button" id="rec-mic" data-i18n="popup_recMic">Record microphone</button>
        <button type="button" id="rec-stop" hidden data-i18n="popup_recStop">Stop recording</button>
      </div>
      <div id="rec-pending" hidden></div>

      <div id="recent-wrap" hidden>
        <h2 data-i18n="popup_recent">Recent</h2>
        <div id="recent"></div>
      </div>
    </section>

    <div id="pending-bar" hidden>
      <span id="pending-text"></span>
      <button type="button" id="retry-queue" data-i18n="popup_retryNow">Retry now</button>
    </div>

    <div id="feedback"></div>

    <footer>
      <button type="button" id="nav-tabs" data-i18n="popup_navTabs">Reading list</button>
      <button type="button" id="nav-app" data-i18n="popup_navApp">Open Gum</button>
      <button type="button" id="nav-settings" data-i18n="popup_navSettings">Settings</button>
    </footer>

    <script src="shared.js"></script>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
