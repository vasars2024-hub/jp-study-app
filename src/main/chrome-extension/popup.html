<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GrammarX</title>
    <style>
      :root {
        --bg: #14161c;
        --panel: #1b1e26;
        --panel-2: #21252f;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e8eaef;
        --muted: #98a0af;
        --accent: #9c2b3d;
        --accent-soft: rgba(156, 43, 61, 0.16);
        --ok: #4cc584;
        --warn: #d8a01d;
        --err: #e05555;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px 10px;
      }
      header strong { font-size: 14px; letter-spacing: 0.01em; }
      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: inherit;
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
      }
      .status-chip::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .status-chip.ok { color: var(--ok); }
      .status-chip.ok::before { background: var(--ok); }
      .status-chip.warn { color: var(--warn); }
      .status-chip.warn::before { background: var(--warn); }
      .status-chip.err { color: var(--err); }
      .status-chip.err::before { background: var(--err); }
      #status-detail {
        margin: 0 14px 10px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 12px;
        display: grid;
        gap: 5px;
      }
      #status-detail[hidden] { display: none; }
      #status-detail .row { display: flex; justify-content: space-between; gap: 8px; }
      #status-detail .k { color: var(--muted); }
      #status-detail .v.ok { color: var(--ok); }
      #status-detail .v.err { color: var(--err); }
      #status-detail .v.warn { color: var(--warn); }
      #status-detail a, .linklike {
        color: #d98a97;
        cursor: pointer;
        text-decoration: none;
        background: none;
        border: 0;
        font: inherit;
        padding: 0;
      }
      section { padding: 0 14px; }
      .page-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .page-card .title {
        font-weight: 600;
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .page-card .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .page-card .meta .pill {
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid var(--border);
      }
      .page-card.empty { color: var(--muted); font-size: 12px; }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .actions button {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 10px;
        cursor: pointer;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        text-align: left;
        transition: background 0.12s ease;
      }
      .actions button:hover { background: var(--panel-2); }
      .actions button.primary {
        background: var(--accent-soft);
        border-color: rgba(156, 43, 61, 0.45);
        font-weight: 600;
      }
      .actions button.primary:hover { background: rgba(156, 43, 61, 0.26); }
      .actions button:disabled { opacity: 0.5; cursor: default; }
      h2 {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 6px;
        font-weight: 600;
      }
      #recent { margin-bottom: 10px; }
      .recent-item {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        padding: 5px 2px;
        font-size: 12px;
        border-bottom: 1px solid var(--border);
      }
      .recent-item:last-child { border-bottom: 0; }
      .recent-item .term {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 190px;
      }
      .recent-item .what { color: var(--muted); font-size: 11px; flex-shrink: 0; }
      .recent-item .what.queued { color: var(--warn); }
      #pending-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 14px 8px;
        padding: 7px 12px;
        border-radius: 9px;
        background: rgba(216, 160, 29, 0.1);
        border: 1px solid rgba(216, 160, 29, 0.3);
        font-size: 12px;
        color: var(--warn);
      }
      #pending-bar[hidden] { display: none; }
      #pending-bar button {
        background: none;
        border: 0;
        color: var(--warn);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
      }
      footer {
        display: flex;
        border-top: 1px solid var(--border);
        margin-top: 2px;
      }
      footer button {
        flex: 1;
        background: none;
        border: 0;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        padding: 10px 4px;
        cursor: pointer;
      }
      footer button:hover { color: var(--text); background: var(--panel); }
      #feedback {
        min-height: 1.1em;
        margin: 0 14px 8px;
        font-size: 12px;
        color: var(--muted);
      }
      #feedback.ok { color: var(--ok); }
      #feedback.err { color: var(--err); }
      #feedback.pending { color: var(--warn); }
    </style>
  </head>
  <body>
    <header>
      <strong>GrammarX</strong>
      <button type="button" id="status-chip" class="status-chip" aria-expanded="false">…</button>
    </header>

    <div id="status-detail" hidden>
      <div class="row"><span class="k">GrammarX app</span><span class="v" id="st-app">…</span></div>
      <div class="row"><span class="k">Pairing</span><span class="v" id="st-pair">…</span></div>
      <div class="row"><span class="k">Anki profile</span><span class="v" id="st-anki">…</span></div>
      <div class="row"><span class="k">Waiting to sync</span><span class="v" id="st-pending">0</span></div>
      <div class="row"><button type="button" class="linklike" id="fix-connection">Open connection settings</button></div>
    </div>

    <section>
      <div class="page-card" id="page-card">
        <div class="title" id="page-title">…</div>
        <div class="meta" id="page-meta"></div>
      </div>

      <div class="actions" id="actions"></div>

      <div id="recent-wrap" hidden>
        <h2>Recent</h2>
        <div id="recent"></div>
      </div>
    </section>

    <div id="pending-bar" hidden>
      <span id="pending-text"></span>
      <button type="button" id="retry-queue">Retry now</button>
    </div>

    <div id="feedback"></div>

    <footer>
      <button type="button" id="nav-tabs">Reading list</button>
      <button type="button" id="nav-app">Open GrammarX</button>
      <button type="button" id="nav-settings">Settings</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
